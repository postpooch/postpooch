<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Postpooch mascot</title>
  <link rel="stylesheet" href="postpooch-mascot.css">
  <link rel="icon" href="../avatar/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../avatar/apple-touch-icon.png">
  <link rel="manifest" href="../avatar/site.webmanifest">
</head>
<body>
  <picture>
    <source
      type="image/webp"
      srcset="
          ../responsive/transparent/webp/postpooch-mascot-transparent-64w.webp 64w,
          ../responsive/transparent/webp/postpooch-mascot-transparent-128w.webp 128w,
          ../responsive/transparent/webp/postpooch-mascot-transparent-256w.webp 256w,
          ../responsive/transparent/webp/postpooch-mascot-transparent-512w.webp 512w,
          ../responsive/transparent/webp/postpooch-mascot-transparent-790w.webp 790w"
      sizes="(max-width: 640px) 70vw, 395px">
    <img
      class="postpooch-mascot postpooch-mascot--hero"
      src="../master/postpooch-mascot-transparent.png"
      srcset="
          ../responsive/transparent/png/postpooch-mascot-transparent-64w.png 64w,
          ../responsive/transparent/png/postpooch-mascot-transparent-128w.png 128w,
          ../responsive/transparent/png/postpooch-mascot-transparent-256w.png 256w,
          ../responsive/transparent/png/postpooch-mascot-transparent-512w.png 512w,
          ../responsive/transparent/png/postpooch-mascot-transparent-790w.png 790w"
      sizes="(max-width: 640px) 70vw, 395px"
      width="790"
      height="806"
      alt="Postpooch dog mascot"
      decoding="async">
  </picture>
</body>
</html>
